<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Latitude — an atlas of human possibility</title>
  <meta name="description" content="An interconnected atlas of what a person can become: confidence, conversation, presence, judgment, craft, and competing visions of excellence. Grounded in evidence, built for curiosity.">
  <meta name="theme-color" content="#F2EDE3" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#111214" media="(prefers-color-scheme: dark)">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Latitude">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..800;1,9..144,300..800&family=Newsreader:ital,opsz,wght@0,6..72,300..600;1,6..72,300..600&family=IBM+Plex+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="css/app.css">
  <script>
    try { var t = localStorage.getItem('lat:theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <header class="topbar" id="topbar">
    <a class="brand" href="#/" aria-label="Latitude home">
      <svg class="brand-mark" viewBox="0 0 48 48" aria-hidden="true"><use href="#logo"/></svg>
      <span class="brand-word">Latitude</span>
    </a>
    <nav class="topnav" aria-label="Primary">
      <a href="#/" data-nav="atlas">Atlas</a>
      <a href="#/map" data-nav="map">Map</a>
      <a href="#/find" data-nav="find">Find</a>
      <a href="#/trail" data-nav="trail">Trail</a>
    </nav>
    <button class="icon-btn" id="themeBtn" aria-label="Change theme" title="Theme">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M12 4a8 8 0 0 1 0 16z" fill="currentColor"/></svg>
    </button>
  </header>
  <div class="progress" id="progress" aria-hidden="true"></div>

  <main id="main" tabindex="-1"></main>

  <nav class="dock" aria-label="Primary">
    <a href="#/" data-nav="atlas"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M3.5 12h17M5 7.5h14M5 16.5h14"/></svg><span>Atlas</span></a>
    <a href="#/map" data-nav="map"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="6" cy="7" r="2"/><circle cx="17" cy="5" r="2"/><circle cx="12" cy="13" r="2"/><circle cx="18" cy="18" r="2"/><circle cx="5" cy="18" r="2"/><path d="M7.6 8.2l3 3.4M13.6 11.6l2.6-4.8M13.5 14.3l3 2.6M10.3 14l-3.7 2.8"/></svg><span>Map</span></a>
    <a href="#/find" data-nav="find"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6"/><path d="M15 15l5 5"/></svg><span>Find</span></a>
    <a href="#/trail" data-nav="trail"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19c3-1 3-5 6-6s5 1 7-2 1-5 3-6"/><circle cx="4" cy="19" r="1.6"/><circle cx="20" cy="5" r="1.6"/></svg><span>Trail</span></a>
  </nav>

  <div class="sheet-scrim" id="scrim" hidden></div>
  <section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" hidden></section>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="logo" viewBox="0 0 48 48">
      <circle cx="24" cy="24" r="19" fill="none" stroke="currentColor" stroke-width="2.4"/>
      <path d="M8.2 16h31.6M5.6 24h14M28.4 24h14M8.2 32h31.6" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/>
      <circle cx="24" cy="24" r="3.2" fill="var(--accent, currentColor)"/>
    </symbol>
  </svg>

  <noscript><p style="padding:2rem;font:1.2rem Georgia,serif">Latitude needs JavaScript to draw its maps and diagrams.</p></noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
