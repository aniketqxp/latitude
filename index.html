<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Latitude</title>
  <meta name="description" content="A corridor of doors. Behind each one, a small strange thing about being a person — a party you can simulate, a ship that is also you, a department that issues permission.">
  <meta name="theme-color" content="#EEE8DC" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0E0D0C" media="(prefers-color-scheme: dark)">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Latitude">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT,WONK@0,9..144,300..900,0..100,0..1;1,9..144,300..900,0..100,0..1&family=IBM+Plex+Mono:ital,wght@0,400;0,500;1,400&display=swap">
  <link rel="stylesheet" href="css/world.css">
  <script>
    try { var t = localStorage.getItem('lat:theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
</head>
<body data-world="corridor">
  <a class="skip" href="#main">Skip to content</a>
  <header class="bar">
    <a class="mark" href="#/" aria-label="Latitude — back to the corridor">
      <svg viewBox="0 0 48 48" aria-hidden="true"><use href="#logo"/></svg><span>Latitude</span>
    </a>
    <div class="bar-end">
      <button class="ibtn" id="curtainBtn" hidden aria-haspopup="dialog">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 3.5h18M5 3.5c0 6 .5 12-1.5 17h5c-.6-5 .2-10 3.5-17M19 3.5c0 6-.5 12 1.5 17h-5c.6-5-.2-10-3.5-17"/></svg>
        <span>Behind the curtain</span>
      </button>
      <button class="ibtn round" id="themeBtn" aria-label="Change theme">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 1 0 16z" fill="currentColor"/></svg>
      </button>
    </div>
  </header>

  <main id="main" tabindex="-1"></main>

  <dialog class="curtain" id="curtain" aria-labelledby="curtainTitle"></dialog>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="logo" viewBox="0 0 48 48">
      <circle cx="24" cy="24" r="19" fill="none" stroke="currentColor" stroke-width="2.4"/>
      <path d="M8.2 16h31.6M5.6 24h14M28.4 24h14M8.2 32h31.6" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/>
      <circle cx="24" cy="24" r="3.2" fill="var(--accent, currentColor)"/>
    </symbol>
  </svg>

  <noscript><p style="padding:2rem;font:1.2rem Georgia,serif">Latitude is a corridor of interactive doors, and the doors need JavaScript to open. The <a href="archive/">reading room</a> needs it too, sorry.</p></noscript>
  <script type="module" src="js/world.js"></script>
</body>
</html>
